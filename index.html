<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>除法爬山大挑戰（筆算直式版）</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans TC',sans-serif;user-select:none;-webkit-user-select:none}.math-grid{display:grid;grid-template-columns:repeat(6,3.2rem);justify-content:end;gap:.35rem}.digit-box{width:3.2rem;height:3.6rem;border-radius:.6rem;text-align:center;font-weight:800;font-size:1.75rem;outline:none;transition:all .2s ease}.small-box{width:3.2rem;height:2.8rem;border-radius:.55rem;text-align:center;font-weight:800;font-size:1.45rem;outline:none}.answer-label{width:3.2rem;text-align:center;font-size:.72rem;font-weight:800;color:#94a3b8}.division-symbol{font-size:2.2rem;font-weight:900;color:#0f766e;line-height:1}.quotient-row{border-bottom:4px solid #1e293b;padding-bottom:.35rem}.division-bracket{padding:.4rem 0 .4rem 0}.division-parenthesis{font-size:4.6rem;line-height:.85;color:#1e293b;margin:3.05rem -.3rem 0 -.12rem;transform:scaleX(.62);font-family:Georgia,serif}.work-row{min-height:3.1rem;border-bottom:2px dashed #cbd5e1}.work-row:last-child{border-bottom:0}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}.animate-shake{animation:shake .4s ease-in-out}@keyframes bounce{0%,100%{transform:scale(.72)}50%{transform:scale(.72) translateY(-10px)}}.animate-step{animation:bounce .35s ease-in-out}@media(max-width:640px){.math-grid{grid-template-columns:repeat(6,2.5rem);gap:.2rem}.digit-box{width:2.5rem;height:3rem;font-size:1.35rem}.small-box,.answer-label{width:2.5rem}.small-box{height:2.4rem;font-size:1.2rem}}
</style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center justify-between p-2 sm:p-4">
<header class="w-full max-w-5xl bg-white rounded-2xl shadow-md p-3 sm:p-4 mb-3 flex flex-wrap items-center justify-between gap-2 border border-slate-200">
 <div class="flex items-center space-x-3"><div class="bg-teal-600 text-white w-10 h-10 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center shadow-md"><i class="fa-solid fa-divide text-xl sm:text-2xl"></i></div><div><h1 class="text-lg sm:text-2xl font-black tracking-wide">除法爬山大挑戰</h1><p class="text-xs sm:text-sm text-slate-500 font-semibold">玉山主峰攻頂版（筆算直式）</p></div></div>
 <div class="flex items-center space-x-2 sm:space-x-3"><select id="levelSelect" onchange="changeLevel(this.value)" class="bg-slate-100 font-bold text-xs sm:text-sm text-slate-700 px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-500 outline-none cursor-pointer"><option value="1">第一關：兩位數 ÷ 一位數</option><option value="2">第二關：三位數 ÷ 一位數</option><option value="3">第三關：四位數 ÷ 一位數</option></select><button onclick="toggleSound()" id="soundBtn" class="w-9 h-9 sm:w-10 sm:h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center shadow-sm" title="開關音效"><i id="soundIcon" class="fa-solid fa-volume-high"></i></button><button onclick="restartChallenge()" class="w-9 h-9 sm:w-10 sm:h-10 bg-teal-100 hover:bg-teal-200 text-teal-800 rounded-xl flex items-center justify-center shadow-sm" title="重新開始"><i class="fa-solid fa-rotate-right"></i></button></div>
</header>
<main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-4 flex-1">
<section class="lg:col-span-5 bg-white rounded-2xl shadow-md p-4 border border-slate-200 flex flex-col items-center justify-between relative overflow-hidden">
 <div class="w-full flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200 mb-2"><div><span class="text-xs text-slate-400 font-bold block">目標頂峰</span><span class="text-sm font-extrabold text-teal-600">玉山主峰 3,952m</span></div><div class="text-right"><span class="text-xs text-slate-400 font-bold block">當前海拔</span><span id="altitudeText" class="text-lg font-black text-emerald-600">0 m</span></div></div>
 <div class="relative w-full h-[320px] sm:h-[400px] bg-gradient-to-b from-sky-200 via-sky-100 to-emerald-50 rounded-xl overflow-hidden border border-slate-200 shadow-inner"><svg id="mountainSvg" viewBox="0 0 400 500" class="w-full h-full"><defs><linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#1e293b"/></linearGradient><linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient></defs><polygon points="200,60 380,480 20,480" fill="url(#mountainGrad)"/><polygon points="200,60 260,160 140,160" fill="url(#snowGrad)" opacity=".9"/><g transform="translate(200 45)"><line x1="0" y1="0" x2="0" y2="25" stroke="#e11d48" stroke-width="3"/><polygon points="0,0 18,6 0,12" fill="#f43f5e"/></g><text x="215" y="65" font-size="11" font-weight="bold">3,952m 頂峰</text><text x="250" y="220" font-size="10" font-weight="bold">2,500m</text><text x="110" y="360" font-size="10" font-weight="bold">1,000m</text><path id="trailPath" d="M80 460 C180 450 320 410 290 360 C260 310 110 330 130 270 C150 210 310 230 260 170 C220 120 210 100 200 70" fill="none" stroke="#14b8a6" stroke-width="8" stroke-linecap="round" stroke-dasharray="6,4"/><g id="climberGroup" transform="translate(80 460)"><g id="avatarSvgContainer" transform="scale(.72) translate(-25 -55)"><circle cx="25" cy="25" r="14" fill="#fbbf24"/><circle cx="25" cy="25" r="9" fill="#fde68a"/><path d="M10 48 Q25 35 40 48 L42 75 L8 75Z" fill="#0f766e"/><path d="M12 75 L8 100 M38 75 L42 100 M8 100 L0 105 M42 100 L50 105" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/><path d="M12 54 L0 70 M38 54 L50 70" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/></g></g></svg><div class="absolute bottom-2 left-2 bg-white/90 px-3 py-1 rounded-full border border-slate-300 text-xs font-bold">第 <span id="currentStepText" class="text-teal-600 text-sm">0</span> / <span id="totalStepsText">10</span> 步</div></div>
 <div class="w-full mt-3 text-center"><div class="bg-teal-50 rounded-xl p-3 border border-teal-100"><div class="text-xs text-teal-600 font-bold">本關完成總數</div><div id="totalCount" class="text-lg font-black text-teal-700">0 / 10</div></div></div>
</section>
<section class="lg:col-span-7 bg-white rounded-2xl shadow-md p-4 border border-slate-200 flex flex-col justify-between items-center"><div class="w-full flex justify-between items-center mb-3"><span class="text-xs font-bold text-slate-400 uppercase tracking-wider">長除法筆算區</span><span id="statusMessage" class="text-sm font-bold text-teal-700 bg-teal-50 px-3 py-1 rounded-full border border-teal-200">請完成商及筆算方格</span></div><div class="w-full bg-white rounded-2xl border border-slate-200 p-4 sm:p-6 flex flex-col items-center justify-center my-auto min-h-[280px] shadow-sm overflow-x-auto"><div id="mathWorkspace"></div><p class="mt-4 text-xs text-slate-400 font-semibold">請依序填寫商、乘積、相減後帶下的數字及餘數；方格內只能輸入數字。</p></div><div class="w-full mt-4 space-y-2"><div class="grid grid-cols-5 gap-2 max-w-md mx-auto"><button onclick="pressKey('1')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-teal-400 active:text-white rounded-xl text-xl font-black shadow-sm transition">1</button><button onclick="pressKey('2')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-teal-400 active:text-white rounded-xl text-xl font-black shadow-sm transition">2</button><button onclick="pressKey('3')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-teal-400 active:text-white rounded-xl text-xl font-black shadow-sm transition">3</button><button onclick="pressKey('4')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-teal-400 active:text-white rounded-xl text-xl font-black shadow-sm transition">4</button><button onclick="pressKey('5')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-teal-400 active:text-white rounded-xl text-xl font-black shadow-sm transition">5</button><button onclick="pressKey('6')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-teal-400 active:text-white rounded-xl text-xl font-black shadow-sm transition">6</button><button onclick="pressKey('7')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-teal-400 active:text-white rounded-xl text-xl font-black shadow-sm transition">7</button><button onclick="pressKey('8')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-teal-400 active:text-white rounded-xl text-xl font-black shadow-sm transition">8</button><button onclick="pressKey('9')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-teal-400 active:text-white rounded-xl text-xl font-black shadow-sm transition">9</button><button onclick="pressKey('0')" class="h-12 bg-slate-100 hover:bg-slate-200 active:bg-teal-400 active:text-white rounded-xl text-xl font-black shadow-sm transition">0</button></div><div class="flex gap-2 max-w-md mx-auto"><button onclick="pressBackspace()" class="flex-1 h-12 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl border border-rose-200 flex items-center justify-center gap-2"><i class="fa-solid fa-backspace"></i>刪除</button><button onclick="checkCurrentAnswer()" class="flex-[2] h-12 bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white font-extrabold text-lg rounded-xl shadow-md flex items-center justify-center gap-2"><i class="fa-solid fa-circle-check"></i>檢查答案</button></div></div></section>
</main>
<div id="summitModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4"><div class="bg-white rounded-3xl max-w-md w-full p-7 text-center shadow-2xl"><div class="text-6xl text-teal-600 mb-3"><i class="fa-solid fa-flag-checkered"></i></div><h2 class="text-2xl font-black mb-2">恭喜登頂！</h2><p id="modalText" class="text-slate-600 mb-5"></p><div class="flex gap-2 justify-center"><button onclick="restartChallenge()" class="px-5 py-3 rounded-xl bg-slate-100 font-bold">再挑戰一次</button><button id="nextLevelBtn" onclick="goToNextLevel()" class="px-5 py-3 rounded-xl bg-teal-600 text-white font-bold">進入下一關</button></div></div></div>
<script>
let currentLevel=1,currentStep=0,totalSteps=10,currentProblem=null,inputFocusOrder=[],currentFocusIndex=0,isCorrectionMode=false,soundOn=true,audioCtx=null;
const usedProblems={1:new Set(),2:new Set(),3:new Set()},results={1:{exact:0,remainder:0},2:{exact:0,remainder:0},3:{exact:0,remainder:0}};
function playSound(type){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=type==='error'?180:type==='correct'?660:420;g.gain.setValueAtTime(.05,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.12);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.13)}catch(e){}}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundIcon').className=soundOn?'fa-solid fa-volume-high':'fa-solid fa-volume-xmark'}
function randomInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function generateProblem(level){const remainderTarget=Math.ceil(totalSteps*.7);let wantRemainder=results[level].remainder<remainderTarget;let n,d,r,key,tries=0;do{d=randomInt(2,9);n=level===1?randomInt(12,98):level===2?randomInt(102,998):randomInt(1000,9999);r=n%d;tries++;if(level===1&&Math.floor(n/d)<=10)continue;if(wantRemainder&&r===0)continue;if(!wantRemainder&&r!==0)continue;key=`${n}/${d}`}while(usedProblems[level].has(key)&&tries<1000);usedProblems[level].add(key);return{dividend:n,divisor:d,quotient:Math.floor(n/d),remainder:r,exact:r===0}}
function makeBox(id,expected,cls='digit-box'){return `<input id="${id}" class="${cls} border-2 border-slate-300 bg-white text-slate-900 focus:border-teal-500 focus:ring-2 focus:ring-teal-400" maxlength="1" inputmode="numeric" data-expected="${expected}" autocomplete="off">`}
function renderMathWorkspace(){const p=currentProblem,w=document.getElementById('mathWorkspace'),q=String(p.quotient),n=String(p.dividend),cols=6,digitStart=cols-n.length;inputFocusOrder=[];currentFocusIndex=0;isCorrectionMode=false;let quotient='',qStart=cols-q.length;for(let i=0;i<cols;i++){const pos=i-qStart;quotient+=pos>=0?`<div>${makeBox(`q_${pos}`,q[pos],'small-box')}</div>`:'<div></div>'}let dividend='';for(let i=0;i<cols;i++){const pos=i-digitStart;dividend+=pos>=0?`<div class="text-center font-black text-2xl w-[3.2rem] sm:w-[3.2rem]">${n[pos]}</div>`:'<div class="w-[3.2rem]"></div>'}let firstActive=n.length-q.length,remaining=0,steps=[];for(let i=0;i<n.length;i++){const current=remaining*10+Number(n[i]);if(i<firstActive){remaining=current;continue}const digit=Math.floor(current/p.divisor),product=digit*p.divisor;remaining=current-product;steps.push({product:String(product),next:i<n.length-1?String(remaining*10+Number(n[i+1])):String(remaining),endCol:digitStart+i,last:i===n.length-1})}const aligned=(value,prefix,endCol)=>{let html='',start=endCol-value.length+1;for(let i=0;i<cols;i++){const pos=i-start;html+=pos>=0&&pos<value.length?`<div>${makeBox(`${prefix}_${pos}`,value[pos],'small-box')}</div>`:'<div></div>'}return html};let work='';steps.forEach((step,i)=>{work+=`<div class="math-grid mt-2">${aligned(step.product,`product_${i}`,step.endCol)}</div><div class="border-b-2 border-slate-700 mt-1"></div>`;if(step.last){if(p.remainder>0)work+=`<div class="math-grid mt-2">${aligned(step.next,`remainder_${i}`,step.endCol)}</div>`}else work+=`<div class="math-grid mt-2">${aligned(step.next,`bringdown_${i}`,step.endCol+1)}</div>`});w.innerHTML=`<div class="flex items-end justify-center"><div class="flex items-start mr-0"><div class="text-2xl font-black text-teal-700 mr-0 mt-[4.15rem]">${p.divisor}</div><div class="division-parenthesis">)</div><div class="division-bracket"><div class="quotient-row math-grid">${quotient}</div><div class="math-grid mt-3">${dividend}</div>${work}</div></div></div>`;for(let i=0;i<q.length;i++)inputFocusOrder.push(`q_${i}`);steps.forEach((step,i)=>{const productStart=step.endCol-step.product.length+1;step.product.split('').forEach((_,j)=>inputFocusOrder.push(`product_${i}_${j}`));if(step.last&&p.remainder===0)return;const nextEnd=step.last?step.endCol:step.endCol+1,nextStart=nextEnd-step.next.length+1;step.next.split('').forEach((_,j)=>inputFocusOrder.push(`${step.last?'remainder':'bringdown'}_${i}_${j}`))});attachInputListeners();focusIndex(0)}
function focusIndex(i){if(i<0||i>=inputFocusOrder.length)return;currentFocusIndex=i;const e=document.getElementById(inputFocusOrder[i]);if(e){e.focus();e.select()}}
function attachInputListeners(){inputFocusOrder.forEach((id,i)=>{const e=document.getElementById(id);if(!e)return;e.addEventListener('focus',()=>currentFocusIndex=i);e.addEventListener('input',()=>{if(!/^\d?$/.test(e.value))e.value='';playSound('key');if(e.value&&i+1<inputFocusOrder.length)focusIndex(i+1);if(isCorrectionMode)liveValidateCheck()});e.addEventListener('keydown',x=>{if(x.key==='Backspace'&&!e.value)focusIndex(i-1);else if(x.key==='ArrowLeft')focusIndex(i-1);else if(x.key==='ArrowRight')focusIndex(i+1);else if(x.key==='Enter')checkCurrentAnswer()})})}
function pressKey(n){const e=document.getElementById(inputFocusOrder[currentFocusIndex]);if(e){e.value=n;playSound('key');if(currentFocusIndex+1<inputFocusOrder.length)focusIndex(currentFocusIndex+1);if(isCorrectionMode)liveValidateCheck()}}
function pressBackspace(){const e=document.getElementById(inputFocusOrder[currentFocusIndex]);if(!e)return;if(e.value)e.value='';else if(currentFocusIndex>0){focusIndex(currentFocusIndex-1);document.getElementById(inputFocusOrder[currentFocusIndex]).value=''}if(isCorrectionMode)liveValidateCheck()}
function fieldCorrect(e){return e&&e.value.trim()===e.dataset.expected}
function checkCurrentAnswer(){let ok=true;inputFocusOrder.forEach(id=>{const e=document.getElementById(id);if(!e)return;const good=fieldCorrect(e);e.classList.remove('border-emerald-500','bg-emerald-50','text-emerald-900','border-red-500','bg-red-50','text-red-700','animate-shake');if(good)e.classList.add('border-emerald-500','bg-emerald-50','text-emerald-900');else{ok=false;e.classList.add('border-red-500','bg-red-50','text-red-700','animate-shake');setTimeout(()=>e.classList.remove('animate-shake'),450)}});ok?onStepSuccess():onStepFailure()}
function liveValidateCheck(){if(inputFocusOrder.every(id=>fieldCorrect(document.getElementById(id))))onStepSuccess()}
function onStepSuccess(){playSound('correct');isCorrectionMode=false;results[currentLevel][currentProblem.exact?'exact':'remainder']++;document.getElementById('statusMessage').textContent='答對了！向前爬升！';document.getElementById('statusMessage').className='text-sm font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200';inputFocusOrder.forEach(id=>document.getElementById(id).disabled=true);currentStep++;updateProgress();updateCounts();if(currentStep>=totalSteps)triggerVictory();else setTimeout(loadNextQuestion,350)}
function onStepFailure(){playSound('error');if(!isCorrectionMode)totalSteps++;isCorrectionMode=true;document.getElementById('totalStepsText').textContent=totalSteps;updateCounts();const s=document.getElementById('statusMessage');s.textContent='有些答案不對，請修正紅色方格後再試一次！';s.className='text-sm font-bold text-rose-600 bg-rose-50 px-3 py-1 rounded-full border border-rose-200'}
function updateProgress(){const path=document.getElementById('trailPath'),g=document.getElementById('climberGroup'),pt=path.getPointAtLength(Math.min(currentStep/totalSteps,1)*path.getTotalLength());g.style.transition='transform .6s ease-out';g.setAttribute('transform',`translate(${pt.x},${pt.y})`);document.getElementById('avatarSvgContainer').classList.add('animate-step');setTimeout(()=>document.getElementById('avatarSvgContainer').classList.remove('animate-step'),400);const ratio=Math.min(currentStep/totalSteps,1);document.getElementById('altitudeText').textContent=Math.round(ratio*3952).toLocaleString()+' m';document.getElementById('currentStepText').textContent=currentStep;document.getElementById('totalStepsText').textContent=totalSteps}
function updateCounts(){document.getElementById('totalCount').textContent=`${currentStep} / ${totalSteps}`}
function loadNextQuestion(){currentProblem=generateProblem(currentLevel);renderMathWorkspace();const s=document.getElementById('statusMessage');s.textContent='請完成商及筆算方格';s.className='text-sm font-bold text-teal-700 bg-teal-50 px-3 py-1 rounded-full border border-teal-200'}
function changeLevel(v){currentLevel=Number(v);restartChallenge()}
function restartChallenge(){currentStep=0;totalSteps=10;usedProblems[currentLevel].clear();results[currentLevel]={exact:0,remainder:0};document.getElementById('summitModal').classList.add('hidden');updateCounts();updateProgress();loadNextQuestion()}
function triggerVictory(){playSound('correct');const levelTitle=currentLevel===1?'第一關：兩位數 ÷ 一位數':currentLevel===2?'第二關：三位數 ÷ 一位數':'第三關：四位數 ÷ 一位數';document.getElementById('modalText').textContent=`你完成了${levelTitle}，共答對 ${currentStep} 題！其中整除 ${results[currentLevel].exact} 題、有餘數 ${results[currentLevel].remainder} 題。`;const b=document.getElementById('nextLevelBtn');if(currentLevel<3){b.classList.remove('hidden');b.textContent=`進入第${currentLevel+1}關`}else b.classList.add('hidden');document.getElementById('summitModal').classList.remove('hidden');document.getElementById('summitModal').classList.add('flex')}
function goToNextLevel(){const nextLevel=currentLevel+1;document.getElementById('levelSelect').value=String(nextLevel);changeLevel(nextLevel)}
window.onload=()=>{updateProgress();updateCounts();loadNextQuestion()}
</script>
</body>
</html>
